<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: transparent;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  .paginator-wrapper {
    display: flex;
    align-items: center;
    background-color: #000000;
    padding: 12px 16px;
    gap: 16px;
    width: 100%;
    box-sizing: border-box;
    border-top: 1px solid #1a1a1a;
    border-bottom: 1px solid #1a1a1a;
  }

  .nav-arrow {
    background: none;
    border: none;
    padding: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s;
  }
  
  .nav-arrow:hover { opacity: 0.7; }
  .nav-arrow svg { fill: #6b6b6b; width: 16px; height: 16px; }

  .options-container {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scroll-behavior: smooth;
    padding: 2px 0;
    -ms-overflow-style: none;
    scrollbar-width: none;
    width: 100%;
  }
  
  .options-container::-webkit-scrollbar { display: none; }

  .option-btn {
    background-color: #1f1f1f;
    color: #e0e0e0;
    border: 1px solid #333333;
    border-radius: 6px;
    width: 44px;
    height: 44px;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s ease;
  }

  .option-btn:hover {
    background-color: #2a2a2a;
    border-color: #555555;
  }

  .option-btn.active {
    border: 2px solid #75d466;
    background-color: #1a2218;
    color: #ffffff;
    font-weight: 500;
  }
</style>
<!-- Include Streamlit Component Library -->
<script src="https://streamlit.com/components/streamlit-lib.v1.js"></script>
</head>
<body>

  <div class="paginator-wrapper">
    <!-- Left Arrow -->
    <button class="nav-arrow" id="scroll-left">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>

    <!-- Options Container -->
    <div class="options-container" id="options-scroll"></div>

    <!-- Right Arrow -->
    <button class="nav-arrow" id="scroll-right">
      <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>
  </div>

  <script>
    // Initialize Streamlit communication
    function onRender(event) {
        if (!window.rendered) {
            window.rendered = true;
            Streamlit.setFrameHeight(75);
        }

        const args = event.detail.args;
        const numOptions = args.num_options;
        const activeIndex = args.active_index;

        const container = document.getElementById("options-scroll");
        container.innerHTML = ""; 

        for(let i = 0; i < numOptions; i++) {
            const btn = document.createElement("div");
            btn.className = "option-btn" + (i === activeIndex ? " active" : "");
            btn.innerText = (i + 1).toString().padStart(2, '0');
            
            // Send selected index back to Python using official library
            btn.addEventListener("click", function() {
                Streamlit.setComponentValue(i);
            });

            if (i === activeIndex) {
                setTimeout(() => btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }), 100);
            }

            container.appendChild(btn);
        }
    }

    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
    Streamlit.setComponentReady();

    // Arrow Scrolling Logic
    const scrollContainer = document.getElementById('options-scroll');
    const scrollAmount = 200; 
    
    document.getElementById('scroll-left').addEventListener('click', () => {
        scrollContainer.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
    });
    
    document.getElementById('scroll-right').addEventListener('click', () => {
        scrollContainer.scrollBy({ left: scrollAmount, behavior: 'smooth' });
    });
  </script>
</body>
</html>
